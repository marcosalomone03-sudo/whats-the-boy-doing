name: Probe official airport flight boards

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-airport-boards.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify Aena and Nuremberg airport APIs
        run: |
          node --input-type=module <<'NODE'
          const h={"User-Agent":"Mozilla/5.0 (compatible; WTBD/1.0)","Accept":"application/json,text/html,*/*","Origin":"https://www.aena.es","Referer":"https://www.aena.es/en/flight-info.html?iata=ALC"};
          async function req(url,method="GET",headers=h){try{const r=await fetch(url,{method,headers,redirect:"follow",signal:AbortSignal.timeout(15000)});const t=await r.text();console.log("\nURL",url,"METHOD",method,"\nHTTP",r.status,"FINAL",r.url,"TYPE",r.headers.get("content-type"),"BYTES",t.length,"\nBODY",t.slice(0,5500));return t}catch(e){console.log("ERROR",url,String(e));return""}}
          for(const type of ["S","L"])for(const airport of ["ALC","PMO","AGP"]){
            await req("https://www.aena.es/sites/Satellite?pagename=AENA_ConsultarVuelos&airport="+airport+"&flightType="+type+"&limit=4&dosDias=si","POST");
            await req("https://www.aena.es/sites/Satellite?pagename=AENA_ConsultarVuelos&airport="+airport+"&flightType="+type,"POST");
          }
          const nue=await req("https://www.airport-nuernberg.de/assets/index.ad3000b20012b9ee.js");
          for(const term of ["apiUrl()","apiUrl:","apiUrl=","flight-status/departures","flight-status/arrivals","airportnue-service.justrelate.io","X-Api-Key","Authorization"]){let p=-1,n=0;while((p=nue.indexOf(term,p+1))>=0&&n++<4)console.log("\nNUE",term,nue.slice(Math.max(0,p-400),Math.min(nue.length,p+1100)));}
          NODE
