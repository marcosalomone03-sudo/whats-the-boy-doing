name: Probe official NUE board API

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-airport-boards.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Query the exact API used by the official board
        run: |
          node --input-type=module <<'NODE'
          const base="https://airportnue-service.justrelate.io/production/api/flight-status";
          const h={"User-Agent":"Mozilla/5.0","Accept":"application/json","Origin":"https://www.airport-nuernberg.de","Referer":"https://www.airport-nuernberg.de/en/flight-status"};
          for(const path of [
            "/departures?lang=en&airportIata=NUE&flightNumber=&date=2026-11-06&hourMin=&hourMax=",
            "/arrivals?lang=en&airportIata=NUE&flightNumber=&date=2026-11-06&hourMin=&hourMax=",
            "/filter-options?lang=en",
            "/departures?lang=en&airportIata=NUE&flightNumber=&date=2026-11-07&hourMin=&hourMax=",
            "/arrivals?lang=en&airportIata=NUE&flightNumber=&date=2026-11-07&hourMin=&hourMax="
          ]){
            const url=base+path;
            try{const r=await fetch(url,{headers:h,signal:AbortSignal.timeout(20000)});const t=await r.text();console.log("\nURL",url,"HTTP",r.status,"TYPE",r.headers.get("content-type"),"BYTES",t.length,"BODY",t.slice(0,9000));}catch(e){console.log("ERROR",url,String(e));}
          }
          NODE
