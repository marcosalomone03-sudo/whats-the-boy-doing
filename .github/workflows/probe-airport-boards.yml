name: Probe official NUE board frontend

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-airport-boards.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect live Nuremberg board frontend
        run: |
          node --input-type=module <<'NODE'
          const headers={"User-Agent":"Mozilla/5.0","Accept":"text/html,application/xhtml+xml,*/*"};
          const url="https://www.airport-nuernberg.de/en/flight-status";
          const r=await fetch(url,{headers,redirect:"follow"});const html=await r.text();
          console.log("PAGE",r.status,r.url,"bytes",html.length);
          const scripts=[...html.matchAll(/<script[^>]+src=["']([^"']+)["']/gi)].map(m=>new URL(m[1],r.url).href);
          console.log("SCRIPTS",JSON.stringify(scripts));
          console.log("HTML FLIGHT SNIPPETS",html.slice(Math.max(0,html.indexOf("flight-status")-800),html.indexOf("flight-status")+3000));
          for(const u of scripts){
           if(!/\.js(\?|$)/.test(u))continue;
           try{
            const x=await fetch(u,{headers,redirect:"follow"});const js=await x.text();
            if(/flight-plan|flight-status|airportnue-service|justrelate|flightStatus|departure|arrival/i.test(js)){
             console.log("\nJS",u,"HTTP",x.status,"bytes",js.length);
             for(const term of ["airportnue-service","flight-plan","flight-status","api/","dateRanges","airportIata","departures","arrivals"]){
              let p=-1,n=0;while((p=js.toLowerCase().indexOf(term.toLowerCase(),p+1))>=0&&n++<4)console.log("MATCH",term,js.slice(Math.max(0,p-400),Math.min(js.length,p+1200)));
             }
            }
           }catch(e){console.log("JSERR",u,String(e))}
          }
          NODE
