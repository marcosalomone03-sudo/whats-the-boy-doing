name: Probe official NUE board authentication

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-airport-boards.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect official board API auth and page data
        run: |
          node --input-type=module <<'NODE'
          const h={"User-Agent":"Mozilla/5.0","Accept":"application/json,text/html,*/*","Origin":"https://www.airport-nuernberg.de","Referer":"https://www.airport-nuernberg.de/en/flight-status"};
          const page=await fetch("https://www.airport-nuernberg.de/en/flight-status",{headers:h});const html=await page.text();
          for(const term of ["W45116","arrivals-and-departures","scheduledTime","flightNumber","apiKey","x-api-key","Authorization"])console.log("HTML",term,html.indexOf(term),html.slice(Math.max(0,html.indexOf(term)-250),Math.max(0,html.indexOf(term))+500));
          const u="https://www.airport-nuernberg.de/assets/index.ad3000b20012b9ee.js";
          const js=await (await fetch(u,{headers:h})).text();
          for(const term of ["publicApiHost","defaultOptions","Missing Authentication Token","api-key","x-api-key","Authorization","filter-options","flightNumber=&date="]){
            let p=-1,n=0;while((p=js.indexOf(term,p+1))>=0&&n++<5)console.log("\nJS",term,js.slice(Math.max(0,p-700),Math.min(js.length,p+1300)));
          }
          NODE
