name: Probe NUE board and Google fallback variants

on:
  push:
    branches: [main]
    paths: [".github/workflows/probe-airport-boards.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Test airport filter and Google HTML variants
        run: |
          node --input-type=module <<'NODE'
          const h={"User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/130.0.0.0 Safari/537.36","Accept":"application/json,text/html,*/*","Origin":"https://www.airport-nuernberg.de","Referer":"https://www.airport-nuernberg.de/en/flight-status"};
          const base="https://airportnue-service.justrelate.io/production/api/flight-status";
          for(const dir of ["departures","arrivals"])for(const airport of ["ALC","PMO","BUD",""]){
            const q="lang=en&"+(airport?"airportIata="+airport+"&":"")+"date=20261106&hourMin=&hourMax=";
            const r=await fetch(base+"/"+dir+"?"+q,{headers:h});const rows=await r.json();
            console.log("BOARD",dir,"filter",airport||"none","count",rows.length);
            for(const x of rows.filter(x=>x.flight?.airline?.iata==="FR"||x.flight?.airline?.iata==="RK").slice(0,10))
              console.log("RYANAIR",dir,x.flight.airline.iata+x.flight.number,"other",dir==="departures"?x.toAirport?.iata:x.fromAirport?.iata,"scheduled",x.scheduledTime,"localDate",x.scheduledLocalDate);
          }
          const q="Ryanair flight NUE ALC 6 November 2026 flight number schedule";
          for(const suffix of ["&gbv=1","&udm=14","&gbv=1&num=10","&udm=14&num=10"]){
            const url="https://www.google.com/search?q="+encodeURIComponent(q)+"&hl=en&gl=de"+suffix;
            const r=await fetch(url,{headers:{"User-Agent":h["User-Agent"],"Accept":"text/html"}});const html=await r.text();
            console.log("GOOGLE",suffix,r.status,html.length,"resultmarkers",html.includes("id=\"search\""),"Ryanair",html.toLowerCase().includes("ryanair"),"FR",html.match(/FR\\s?\\d{2,5}/g)?.slice(0,10)||[]);
            const p=html.toLowerCase().indexOf("ryanair");console.log("SNIPPET",p,p>=0?html.slice(Math.max(0,p-300),p+700):html.slice(-500));
          }
          NODE
