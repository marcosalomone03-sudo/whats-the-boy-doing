name: Probe official airport flight boards

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-airport-boards.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect public airport board data endpoints
        run: |
          node --input-type=module <<'NODE'
          const headers={"User-Agent":"Mozilla/5.0 (compatible; WTBD-AirportBoardProbe/1.0)","Accept":"application/json,text/html,application/javascript,*/*"};
          async function get(url){const r=await fetch(url,{headers,redirect:"follow",signal:AbortSignal.timeout(20000)});const t=await r.text();console.log("\nURL",url,"\nHTTP",r.status,"FINAL",r.url,"TYPE",r.headers.get("content-type"),"BYTES",t.length,"\nBODY",t.slice(0,7000));return t;}
          const aena=await get("https://www.aena.es/publica/assets/js/applications/infovuelos/infovuelos.main.chunk.js?v=1.34");
          for(const term of ["wpadesnueva","getDefaultAirport","ListaAeropuertosAena","sendParentDataAeropuertosAena","fetch(","axios","api/","AeropuertoProp"]){let p=-1,n=0;while((p=aena.toLowerCase().indexOf(term.toLowerCase(),p+1))>=0&&n++<5)console.log("\nAENA",term,aena.slice(Math.max(0,p-500),Math.min(aena.length,p+1000)));}
          const bud=await get("https://www.bud.hu/build/assets/app-CYMcx8Ka.js");
          for(const term of ["app-prod-bud","flight.search","flightSearch","flight-search","route:function","window.route","baseURL","axios.create"]){let p=-1,n=0;while((p=bud.toLowerCase().indexOf(term.toLowerCase(),p+1))>=0&&n++<4)console.log("\nBUD",term,bud.slice(Math.max(0,p-400),Math.min(bud.length,p+900)));}
          const stnPage=await get("https://www.stanstedairport.co.uk/departures/");
          for(const term of ["FR4208","__NEXT_DATA__","flightNumber","flightTime","departure","flightStatus","api/"]){let p=-1,n=0;while((p=stnPage.toLowerCase().indexOf(term.toLowerCase(),p+1))>=0&&n++<3)console.log("\nSTN HTML",term,stnPage.slice(Math.max(0,p-250),Math.min(stnPage.length,p+700)));}
          for(const url of [
            "https://www.airport-nuernberg.de/api/flight-status/departures?lang=en&airportIata=NUE&date=20261106",
            "https://www.airport-nuernberg.de/api/flight-status/arrivals?lang=en&airportIata=NUE&date=20261106",
            "https://www.bud.hu/flight-search/quick",
            "https://app-prod-bud-web-brata3fggtb9dacx.northeurope-01.azurewebsites.net"
          ]){try{await get(url)}catch(e){console.log("\nPROBE ERROR",url,String(e))}}
          NODE
