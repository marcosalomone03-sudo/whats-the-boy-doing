name: Probe official airport flight boards

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-airport-boards.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Test Nuremberg official flight plan feed
        run: |
          node --input-type=module <<'NODE'
          const h={"User-Agent":"Mozilla/5.0 (compatible; WTBD/1.0)","Accept":"application/json,*/*","Origin":"https://www.airport-nuernberg.de","Referer":"https://www.airport-nuernberg.de/en/flight-status"};
          for(const url of [
            "https://airportnue-service.justrelate.io/production/api/flight-plan?lang=en&airports=NUE&dateRanges=20261106:20261106",
            "https://airportnue-service.justrelate.io/production/api/flight-plan?lang=en&airports=NUE&dateRanges=2026-11-06:2026-11-06",
            "https://airportnue-service.justrelate.io/production/api/flight-plan?lang=en&airports=NUE",
            "https://airportnue-service.justrelate.io/production/api/flight-status/departures?lang=en&airportIata=NUE"
          ]){
            try{const r=await fetch(url,{headers:h,signal:AbortSignal.timeout(20000)});const t=await r.text();console.log("\nURL",url,"HTTP",r.status,"TYPE",r.headers.get("content-type"),"BYTES",t.length,"BODY",t.slice(0,7000));try{const j=JSON.parse(t);console.log("JSON SHAPE",Array.isArray(j)?"array "+j.length:Object.keys(j||{}),"FIRST",Array.isArray(j)?j.slice(0,3):j);}catch{}}catch(e){console.log("ERROR",url,String(e));}
          }
          NODE
