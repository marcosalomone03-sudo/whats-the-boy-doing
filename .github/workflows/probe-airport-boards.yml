name: Probe NUE board and Google search results

on:
  push:
    branches: [main]
    paths: [".github/workflows/probe-airport-boards.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe exact public requests
        run: |
          node --input-type=module <<'NODE'
          const h={"User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/130.0.0.0 Safari/537.36","Accept":"application/json,text/html,*/*","Origin":"https://www.airport-nuernberg.de","Referer":"https://www.airport-nuernberg.de/en/flight-status"};
          const base="https://airportnue-service.justrelate.io/production/api/flight-status";
          const qs=[
            "lang=en&date=20261106",
            "lang=en&airportIata=&date=20261106&hourMin=&hourMax=",
            "lang=en&date=20261106&hourMin=&hourMax=",
            "lang=en&airportIata=NUE&date=20261106",
            "lang=en&airportIata=NUE&flightNumber=&date=20261106&hourMin=00&hourMax=24"
          ];
          for(const dir of ["departures","arrivals"])for(const q of qs){const r=await fetch(base+"/"+dir+"?"+q,{headers:h});const t=await r.text();console.log("NUE",dir,q,"HTTP",r.status,"BODY",t.slice(0,1400));}
          const q="Ryanair flight NUE ALC 6 November 2026 flight number schedule";
          const gr=await fetch("https://www.google.com/search?q="+encodeURIComponent(q)+"&num=10&hl=en&gl=de",{headers:{"User-Agent":h["User-Agent"],"Accept":"text/html"}});
          const gt=await gr.text();
          console.log("GOOGLE",gr.status,gt.length);
          for(const term of ["FR904","FR","Ryanair","NUE","ALC","<div id=\"search\""]){const p=gt.indexOf(term);console.log("GOOGLE TERM",term,p,p>=0?gt.slice(Math.max(0,p-350),p+900):"");}
          NODE
