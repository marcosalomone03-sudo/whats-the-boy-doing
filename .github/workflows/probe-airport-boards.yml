name: Probe official airport flight boards

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-airport-boards.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Test Nuremberg service and Palermo official board
        run: |
          node --input-type=module <<'NODE'
          async function req(url,headers={}){try{const r=await fetch(url,{headers:{"User-Agent":"Mozilla/5.0 (compatible; WTBD/1.0)","Accept":"application/json,text/html,*/*",...headers},redirect:"follow",signal:AbortSignal.timeout(20000)});const t=await r.text();console.log("\nURL",url,"HTTP",r.status,"FINAL",r.url,"TYPE",r.headers.get("content-type"),"BYTES",t.length,"BODY",t.slice(0,2500));return t}catch(e){console.log("ERROR",url,String(e));return""}}
          const base="https://airportnue-service.justrelate.io/production/api/flight-status/";
          for(const dir of ["departures","arrivals"]){
            await req(base+dir+"?lang=en&airportIata=NUE&date=20261106",{"Origin":"https://www.airport-nuernberg.de","Referer":"https://www.airport-nuernberg.de/en/flight-status"});
            await req(base+dir+"?lang=en&airportIata=NUE&date=2026-11-06",{"Origin":"https://www.airport-nuernberg.de","Referer":"https://www.airport-nuernberg.de/en/flight-status"});
            await req(base+dir+"?lang=en&airportIata=NUE",{"Origin":"https://www.airport-nuernberg.de","Referer":"https://www.airport-nuernberg.de/en/flight-status"});
          }
          for(const url of ["https://www.aeroportodipalermo.it/voli/","https://www.aeroportodipalermo.it/en/voli/","https://aeroportodipalermo.it/voli/"]){
            const html=await req(url);
            console.log("PALERMO FLIGHT NUMBERS",JSON.stringify([...new Set(html.match(/\b(?:FR|W4|AZ|U2|BA|EW|VY|IB)\s?\d{2,5}\b/g)||[])].slice(0,40)));
            console.log("PALERMO SCRIPTS",JSON.stringify([...html.matchAll(/<script[^>]+src=["']([^"']+)["']/gi)].map(m=>m[1]).slice(-20)));
          }
          NODE
