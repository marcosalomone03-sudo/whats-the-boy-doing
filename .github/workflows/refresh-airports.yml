name: Refresh global airport catalogue

on:
  schedule:
    - cron: "35 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build-airports.mjs"
      - ".github/workflows/refresh-airports.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Build global IATA airport catalogue
        run: node scripts/build-airports.mjs
      - name: Commit updated catalogue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add airports.json
          if git diff --cached --quiet; then
            echo "Airport catalogue is already current."
          else
            git commit -m "Refresh global airport catalogue"
            git push
          fi
