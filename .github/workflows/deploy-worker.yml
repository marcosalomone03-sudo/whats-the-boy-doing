name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - "worker.js"
      - "app.js"
      - "wrangler.toml"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate JavaScript syntax
        run: |
          node --check worker.js
          node --check app.js

      - name: Deploy wtbd-flight-proxy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Smoke-test deployed Worker
        env:
          WORKER_URL: https://wtbd-flight-proxy.marco-salomone-03.workers.dev
        run: |
          node --input-type=module <<'NODE'
          const base=process.env.WORKER_URL;
          async function request(path){
            const r=await fetch(base+path,{headers:{Accept:"application/json"}});
            const raw=await r.text();let data;
            try{data=JSON.parse(raw);}catch{throw new Error(path+" returned invalid JSON, HTTP "+r.status);}
            if(!r.ok)throw new Error(path+" HTTP "+r.status+" "+(data.detail||data.error||raw.slice(0,200)));
            console.log("PASS",path,"HTTP",r.status);
            return {data,response:r};
          }
          for(const [origin,destination] of [["NUE","ALC"],["ALC","NUE"]]){
            const {data}=await request("/api/schedule?origin="+origin+"&destination="+destination+"&year=2026&month=11&date=2026-11-06");
            if(!Array.isArray(data.days))throw new Error(origin+"-"+destination+" did not return days[]");
            const flights=data.days.flatMap(day=>day.flights||[]);
            console.log("INFO",origin+"-"+destination,"source:",data.source,"flights:",flights.map(f=>f.flightNumber).join(", ")||"none");
            if(!data.source||(!data.source.includes("Nuremberg Airport")&&!data.source.includes("Google Search")))throw new Error("Schedule source metadata missing");
          }
          const pmo=await request("/api/schedule?origin=PMO&destination=NUE&year=2026&month=11&date=2026-11-06");
          const pmoFlights=pmo.data.days.flatMap(day=>day.flights||[]).map(f=>f.flightNumber);
          console.log("INFO PMO-NUE 2026-11-06 source:",pmo.data.source,"flights:",pmoFlights.join(", ")||"none");
          if(!pmoFlights.includes("FR904"))throw new Error("Official NUE arrivals board did not recover expected FR904 on 2026-11-06");

          const aircraft=await request("/api/aircraft?lat=49.4987&lon=11.078&dist=35");
          if(!Array.isArray(aircraft.data.ac))throw new Error("ADS-B response missing ac[]");
          console.log("INFO ADS-B aircraft near NUE:",aircraft.data.ac.length);
          const hex=aircraft.data.ac.find(a=>/^[0-9a-f]{6}$/i.test(String(a.hex||"")))?.hex;
          if(hex)await request("/api/hex?icao="+encodeURIComponent(hex));
          NODE
