name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
    paths:
      - "worker.js"
      - "wrangler.toml"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Deploy wtbd-flight-proxy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Configure FlightNerve API key (when provided)
        if: ${{ secrets.FLIGHTNERVE_API_KEY != '' }}
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          secrets: |
            FLIGHTNERVE_API_KEY
        env:
          FLIGHTNERVE_API_KEY: ${{ secrets.FLIGHTNERVE_API_KEY }}

      - name: Smoke-test live Worker endpoints
        env:
          WORKER_URL: https://wtbd-flight-proxy.marco-salomone-03.workers.dev
        run: |
          node --input-type=module <<'NODE'
          const base = process.env.WORKER_URL;
          async function request(path, accepted = [200]) {
            const response = await fetch(base + path, { headers: { Accept: "application/json" } });
            const raw = await response.text();
            let data;
            try { data = JSON.parse(raw); } catch { throw new Error(path + ": response is not valid JSON (HTTP " + response.status + ")"); }
            if (!accepted.includes(response.status)) {
              throw new Error(path + ": unexpected HTTP " + response.status + " — " + (data.detail || data.error || raw.slice(0, 250)));
            }
            console.log("PASS", path, "HTTP", response.status);
            return { response, data };
          }

          const schedule = await request("/api/schedule?origin=NUE&destination=BUD&year=2026&month=11");
          if (!schedule.data || !Array.isArray(schedule.data.days)) {
            throw new Error("Schedule endpoint did not return the expected days[] structure");
          }
          console.log("INFO schedule days:", schedule.data.days.length,
            "flights:", schedule.data.days.reduce((n, day) => n + (day.flights || []).length, 0),
            "sources:", schedule.response.headers.get("X-WTBD-Schedule-Sources") || "header missing");

          const pmo = await request("/api/schedule?origin=PMO&destination=NUE&year=2026&month=11&date=2026-11-06");
          if (!pmo.data || !Array.isArray(pmo.data.days)) throw new Error("PMO-NUE schedule did not return days[]");
          const nov6 = pmo.data.days.find(day => Number(day.day) === 6);
          const nov6Flights = (nov6?.flights || []).map(f => String(f.number || f.flightNumber || "").replace(/\\s/g, "").toUpperCase());
          console.log("INFO PMO-NUE 2026-11-06 flights:", nov6Flights.join(", ") || "none", "source:", pmo.response.headers.get("X-WTBD-Schedule-Sources") || "header missing");
          if (!nov6Flights.includes("FR904")) console.warn("WARN FR904 on 2026-11-06 is still absent; timetable gap remains unresolved");
          else console.log("PASS FR904 recovered for 2026-11-06");

          const aircraft = await request("/api/aircraft?lat=51.4700&lon=-0.4543&dist=35");
          if (!aircraft.data || !Array.isArray(aircraft.data.ac)) {
            throw new Error("Aircraft endpoint did not return the expected ac[] structure");
          }
          console.log("INFO aircraft observed:", aircraft.data.ac.length);

          const hex = aircraft.data.ac.find(item => /^[0-9a-f]{6}$/i.test(String(item.hex || "")))?.hex;
          if (hex) {
            await request("/api/hex?icao=" + encodeURIComponent(hex));
          } else {
            await request("/api/hex?icao=abcdef", [200, 404]);
            console.log("INFO no aircraft hex was available for a positive lookup; syntax and upstream response checked");
          }
          NODE
