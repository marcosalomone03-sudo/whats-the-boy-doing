name: Probe Ryanair airport catalogue

on:
  push:
    branches: [main]
    paths: [".github/workflows/probe-ryanair-airports.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Ryanair public airport catalogue and ADS-B fields
        run: |
          node --input-type=module <<'NODE'
          const urls=[
           "https://api.ryanair.com/aggregate/3/common?embedded=airports,countries,cities,regions,nearbyAirports,defaultAirport&market=en-gb",
           "https://desktopapps.ryanair.com/en-gb/res/stations"
          ];
          for(const url of urls){
           const r=await fetch(url,{headers:{"User-Agent":"Mozilla/5.0","Accept":"application/json"}});
           const t=await r.text();console.log("RYANAIR",url,"HTTP",r.status,"LEN",t.length,"BODY",t.slice(0,2200));
          }
          const r=await fetch("https://api.adsb.lol/v2/lat/49.4987/lon/11.078/dist/35",{headers:{"Accept":"application/json","User-Agent":"WTBD/1.0"}});
          const d=await r.json();console.log("ADSB HTTP",r.status,"NOW",d.now,"SAMPLE",JSON.stringify(d.ac?.[0]||{}));
          NODE
